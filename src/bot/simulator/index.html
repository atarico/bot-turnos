<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador — bot de turnos</title>
<style>
  :root {
    --bg: #0b141a; --panel: #111b21; --bar: #202c33; --in: #202c33; --out: #005c4b;
    --text: #e9edef; --muted: #8696a0; --accent: #00a884; --line: #2a3942;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column;
         background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { background: var(--bar); padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .biz { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .who { display: flex; gap: 8px; padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .who button { flex: 1; background: transparent; color: var(--muted); border: 1px solid var(--line);
                border-radius: 999px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .who button.on { background: var(--accent); color: #05231c; border-color: var(--accent); font-weight: 600; }
  .who .reset { flex: 0 0 auto; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; }
  .row.customer { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .bot .bubble { background: var(--in); border-top-left-radius: 2px; }
  .customer .bubble { background: var(--out); border-top-right-radius: 2px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .opts button { background: transparent; color: var(--accent); border: 1px solid var(--accent);
                 border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; text-align: left; }
  .opts button:disabled { color: var(--muted); border-color: var(--line); cursor: default; }
  .opts .desc { display: block; color: var(--muted); font-size: 11px; }
  .action { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 13px; }
  footer { display: flex; gap: 8px; padding: 12px; background: var(--bar); border-top: 1px solid var(--line); }
  footer input { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
                 border-radius: 999px; padding: 10px 14px; outline: none; }
  footer button { background: var(--accent); color: #05231c; border: 0; border-radius: 999px;
                  padding: 10px 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="biz" id="biz">—</div>
    <div class="sub">Simulador local · payloads reales de la Cloud API</div>
  </header>
  <div class="who" id="who"></div>
  <main id="thread"></main>
  <footer>
    <input id="input" placeholder="Escribí un mensaje…" autocomplete="off">
    <button id="send">Enviar</button>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let phone = null;

async function boot() {
  const { business, customers } = await (await fetch('/sim/customers')).json();
  $('biz').textContent = business;
  const who = $('who');
  Object.entries(customers).forEach(([number, name], i) => {
    const b = document.createElement('button');
    b.textContent = name + ' · …' + number.slice(-4);
    b.onclick = () => select(number);
    b.dataset.phone = number;
    who.appendChild(b);
    if (i === 0) phone = number;
  });
  const reset = document.createElement('button');
  reset.className = 'reset';
  reset.textContent = '↺';
  reset.title = 'Limpiar la conversación';
  reset.onclick = async () => { await fetch('/sim/reset', { method: 'POST' }); render(); };
  who.appendChild(reset);
  select(phone);
}

function select(number) {
  phone = number;
  document.querySelectorAll('.who button[data-phone]').forEach(b =>
    b.classList.toggle('on', b.dataset.phone === number));
  render();
}

async function send(body) {
  await fetch('/sim/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, ...body }),
  });
  render();
}

async function render() {
  const thread = await (await fetch('/sim/thread?phone=' + phone)).json();
  const main = $('thread');
  main.innerHTML = '';
  if (!thread.length) {
    main.innerHTML = '<div class="empty">Escribí cualquier cosa para arrancar.</div>';
    return;
  }
  const lastBot = thread.map(m => m.role).lastIndexOf('bot');
  thread.forEach((msg, i) => {
    const row = document.createElement('div');
    row.className = 'row ' + msg.role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.body;

    if (msg.options && msg.options.length) {
      if (msg.action) {
        const a = document.createElement('div');
        a.className = 'action';
        a.textContent = '▤ ' + msg.action;
        bubble.appendChild(a);
      }
      const opts = document.createElement('div');
      opts.className = 'opts';
      msg.options.forEach(o => {
        const b = document.createElement('button');
        b.innerHTML = '';
        b.appendChild(document.createTextNode(o.title));
        if (o.description) {
          const d = document.createElement('span');
          d.className = 'desc';
          d.textContent = o.description;
          b.appendChild(d);
        }
        b.disabled = i !== lastBot;
        b.onclick = () => send({ reply_id: o.id, label: o.title });
        opts.appendChild(b);
      });
      bubble.appendChild(opts);
    }
    row.appendChild(bubble);
    main.appendChild(row);
  });
  main.scrollTop = main.scrollHeight;
}

$('send').onclick = () => {
  const value = $('input').value.trim();
  if (!value) return;
  $('input').value = '';
  send({ text: value });
};
$('input').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });

boot();
</script>
</body>
</html>
