[project]
name = "whatsapp-turnos-bot"
version = "0.1.0"
description = "Standalone WhatsApp appointment bot backed by the business's own calendar."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
